<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>JS</title>
  </head>
  <body>
    <section id="hero-section">
      <div class="hero-info">
        <h1>Rock-Paper-Scissors</h1>
        <div id="buttons">
          <button onclick="game('rock')">Rock</button>
          <button onclick="game('paper')">Paper</button>
          <button onclick="game('scissors')">Scissors</button>
        </div>
        <div id="response">
          <h3 id="player-choice"></h3>
          <h3 id="pc-choice"></h3>
          <h2 id="game-result"></h2>
          <h3 id="score"></h3>
          <button onclick="game('reset')">New game</button>
          <h3 id="rounds"></h3>
          <h3 id="leader"></h3>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
