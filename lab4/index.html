<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Lab 4 Objects</title>
  </head>
  <body>
    <section id="shopping-list-section">
      <h2>Shopping List</h2>
      <input id="product-input" type="text" />
      <button id="product-btn-start">Add first</button>
      <button id="product-btn-end">Add last</button>
      <button id="product-btn-del-start">Delete first</button>
      <button id="product-btn-del-end">Delete last</button>
      <p id="product-list"></p>
    </section>

    <section id="catalog-section">
      <h2>Electronic Catalog</h2>
      <p id="students-count"></p>

      <h3>Add student</h3>
      <input id="student-name" type="text" placeholder="Name" />
      <input id="student-age" type="number" placeholder="Age" />
      <input id="student-grade" type="number" placeholder="Grade" />
      <button id="student-add">Add student</button>

      <h3>Delete student</h3>
      <input id="student-delete-name" type="text" placeholder="Student name" />
      <button id="student-delete">Delete student</button>

      <h3>Search student</h3>
      <input
        id="student-search-name"
        type="text"
        placeholder="Search student"
      />
      <button id="student-search">Search</button>
      <p id="student-result"></p>

      <h3>Catalog</h3>
      <div id="catalog"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
