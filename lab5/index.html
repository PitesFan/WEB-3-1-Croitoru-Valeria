<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Cards</title>
  </head>
  <body>
    <form id="addElev">
      <input id="name" type="text" placeholder="Name" />
      <input id="age" type="text" placeholder="Age" />
      <input id="major" type="text" placeholder="Major" />
      <input id="group" type="text" placeholder="Group" />
      <button type="submit">Add</button>
    </form>

    <div id="error"></div>

    <div id="controls">
      <label>
        justify-content:
        <select id="justify-content">
          <option value="flex-start">flex-start</option>
          <option value="center">center</option>
          <option value="flex-end">flex-end</option>
          <option value="space-between">space-between</option>
          <option value="space-around">space-around</option>
          <option value="space-evenly">space-evenly</option>
        </select>
      </label>

      <label>
        align-items:
        <select id="align-items">
          <option value="stretch">stretch</option>
          <option value="flex-start">flex-start</option>
          <option value="center">center</option>
          <option value="flex-end">flex-end</option>
        </select>
      </label>

      <label>
        flex-wrap:
        <input id="wrap" type="checkbox" />
      </label>

      <label>
        gap:
        <input id="numberIn" type="number" min="0" value="10" />
        <button id="submitNumber" type="button">Set</button>
      </label>
    </div>

    <p>Students: <span id="count">0</span></p>

    <section id="studentList"></section>

    <script src="script.js"></script>
  </body>
</html>
